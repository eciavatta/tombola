    <script>
      // Apply the saved theme before the app loads, to avoid a flash of the wrong colors.
      // Keep in sync with src/lib/theme.ts.
      ;(function () {
        var themes = ['light', 'dark', 'christmas', 'contrast']
        var theme
        try {
          theme = JSON.parse(localStorage.getItem('tombola.theme'))
        } catch (error) {}
        if (themes.indexOf(theme) === -1) {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
