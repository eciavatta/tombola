<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Emiliano Ciavatta" />
    <link rel="author" href="https://eciavatta.dev/" />
    <title>Tombola</title>
    <script>
      // Apply the saved theme before the app loads, to avoid a flash of the wrong colors.
      // Keep in sync with src/lib/theme.ts.
      ;(function () {
        var themes = ['light', 'dark', 'christmas', 'contrast']
        var theme
        try {
          theme = JSON.parse(localStorage.getItem('tombola.theme'))
        } catch (error) {}
        if (themes.indexOf(theme) === -1) {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
